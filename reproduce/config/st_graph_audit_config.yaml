version: '0.9'
spec: st_graph_audit_spec.md
freeze_training: gene-gated mclust 0.617 unchanged
thresholds:
  tau_gene: 0.2
  tau_img: 0.7
  tau_fm: 0.8
  tau_remote: 3.0
skip_rule:
  n_collide_min: 10
  nn_mult_min: 3.0
  gene_median_max: 0.2
harm_budgets:
  breast_skip_on_strict:
    lookalike_max: 0
    remote_max: 0
    remote_gene_agree_max: 0
    spatial_lookalike_max: 0
  breast_skip_on_ffpe:
    lookalike_max: 1
    remote_max: 0
    remote_gene_agree_max: 0
    spatial_lookalike_max: 1
  breast_skip_off:
    skip_rule_must_be: false
    mode: skip_off_confirmed
  cross_layer:
    mode: report_only
audit_arms_default:
- GraphST (k=3)
- STAGATE (radius)
- SpaceFlow (spatial)
- STAIG spatial (k=5)
- STAIG+ungated FM skip
- STAMP gene-gated skip
- STAMP gene-gated + max_hops=2
